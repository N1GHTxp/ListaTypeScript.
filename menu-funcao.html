<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de Repetição</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="menu-body">

    <div class="page-card">
        <h1>Questões de Repetição</h1>
        
        <div class="menu-questoes">
            <a href="dist/exercicios/função/questao1.html" class="btn-questao" title="Crie uma função somarAte que recebe um número inteiro positivo. Use um laço de repetição para calcular a soma de todos os números de 1 até o número fornecido. (Ex: somarAte(4) deve retornar 10, pois 1+2+3+4 = 10)"><span>1.</span> Soma até N com laço</a>
            <a href="dist/exercicios/função/questao2.html" class="btn-questao" title="O IF tem uma estufa e o professor de biologia quer um sistema simples para monitorar a temperatura. Crie uma função ler_temperatura(): Simula a leitura de um sensor, pedindo ao usuário para digitar uma temperatura (valor inteiro ou float). Retorna a temperatura lida. Crie uma função verificar_alerta_temperatura(temperatura): Recebe a temperatura. Se a temperatura for menor que 10 ou maior que 30, retorna True (alerta). Caso contrário, retorna False. Crie uma função emitir_mensagem_alerta(status_alerta): Recebe o status_alerta (True ou False). Se status_alerta for True, imprime &quot;ALERTA: Temperatura fora da faixa ideal!&quot;. Se status_alerta for False, imprime &quot;Temperatura dentro da faixa normal.&quot;"><span>2.</span> Monitor de temperatura</a>
            <a href="dist/exercicios/função/questao3.html" class="btn-questao" title="Crie uma função que recebe um número (ex: 5) e em seguida utilize loops aninhados para desenhar um triângulo de asteriscos no console. Exemplo para entrada 3: * ** ***"><span>3.</span> Triângulo de asteriscos</a>
            <a href="dist/exercicios/função/questao4.html" class="btn-questao" title="Crie uma função que recebe um valor de saque (inteiro). A função deve dizer quantas notas de 50, 20 e 10 são necessárias para o saque (priorizando as maiores). Use um laço while para ir subtraindo do valor total"><span>4.</span> Notas para saque</a>
            <a href="dist/exercicios/função/questao5.html" class="btn-questao" title="Crie uma função que recebe dois números: início e fim. Depois use um laço para percorrer esse intervalo e imprimir apenas os números que são múltiplos de 3"><span>5.</span> Múltiplos de 3 no intervalo</a>
            <a href="dist/exercicios/função/questao6.html" class="btn-questao" title="Faça um programa para o cálculo de uma folha de pagamento fictício, sabendo que os descontos são do Imposto de Renda, que depende do salário bruto (conforme tabela abaixo), 3% para o Sindicato, 6% de vale transporte, 8% de vale alimentação, 10% do INSS e o FGTS que corresponde a 11% do Salário Bruto, mas não é descontado (é a empresa que deposita). O Salário Líquido corresponde ao Salário Bruto menos os descontos. O programa deverá pedir ao usuário o valor da sua hora e a quantidade de horas trabalhadas no mês. Desconto do IR: Salário Bruto até R$ 2428,80 (inclusive) - isento, etc. Imprima na tela as informações dispostas conforme o exemplo"><span>6.</span> Folha de pagamento</a>
            <a href="dist/exercicios/função/questao7.html" class="btn-questao" title="Sistema de Eficiência de Combustível. Crie um programa que ajude um motorista a saber a autonomia do seu carro. Função 1: Recebe a distância percorrida e a quantidade de combustível gasta, retornando o consumo médio (km/l). Função 2: Recebe o consumo médio e a capacidade total do tanque, retornando quantos quilômetros o carro percorre com o tanque cheio"><span>7.</span> Eficiência de combustível</a>
            <a href="dist/exercicios/função/questao8.html" class="btn-questao" title="Controle de Estoque de Loja (Loop e Relatório). Faça um programa que gerencie a entrada de produtos em um estoque. O programa deve solicitar o preço unitário do produto e a quantidade comprada. Crie uma função que recebe preço e quantidade. Se a quantidade for maior que 10 unidades, aplica 5% de desconto sobre o valor total daquele item. Retorna o valor final. O programa deve repetir a solicitação até que o preço informado seja zero. Ao encerrar, exiba o total geral investido no estoque e a média de preço dos produtos cadastrados"><span>8.</span> Controle de estoque</a>
            <a href="dist/exercicios/função/questao9.html" class="btn-questao" title="Simulador de Aprovação de Crédito. Uma loja quer automatizar a análise de crédito de clientes. Função solicitar_renda_mensal(): Pede a renda do usuário. Se o valor for negativo ou zero, pede novamente até ser válido. Função analisar_credito(renda, valor_parcela): A parcela não pode ultrapassar 30% da renda. Se a renda for acima de R$ 5.000,00, o cliente ganha um bônus de R$ 500,00 no limite final. Retorna true para aprovado ou false para negado. Função exibir_status(resultado): Imprime &quot;Crédito Aprovado&quot; ou &quot;Crédito Negado&quot;"><span>9.</span> Simulador de crédito</a>
            <a href="dist/exercicios/função/questao10.html" class="btn-questao" title="Calculadora de IMC com Classificação. Um personal trainer precisa de uma ferramenta para avaliar seus alunos. Função calcular_imc(peso, altura): Retorna o resultado da fórmula IMC = peso/altura². Função classificar_imc(valor_imc): Recebe o IMC e retorna uma string: Abaixo de 18.5: &quot;Abaixo do peso&quot;, Entre 18.5 e 24.9: &quot;Peso Normal&quot;, 25 ou mais: &quot;Sobrepeso&quot;. Função exibir_laudo(nome, classificacao): Imprime: &quot;Paciente: [nome] - Status: [classificacao]&quot;"><span>10.</span> Calculadora de IMC</a>
        </div>

        <a href="./index.html" class="voltar">&larr; voltar</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => document.querySelectorAll('.page-card').forEach(card => card.classList.add('enter')));
            document.querySelectorAll('.btn-questao').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const card = this.closest('.page-card');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
            document.querySelectorAll('.voltar').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const card = this.closest('.page-card');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
        });
    </script>

</body>
</html>
