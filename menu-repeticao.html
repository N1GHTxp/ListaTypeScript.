<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de Repetição</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="menu-body">

    <div class="page-card">
        <h1>Questões de Repetição</h1>
        
        <div class="menu-questoes">
            <a href="dist/exercicios/repetição/q1.html" class="btn-questao" title="Crie um programa que peça números até o usuário digitar 0 e mostre: Quantidade de números digitados, Soma total"><span>1.</span> Contar e somar números até 0</a>
            <a href="dist/exercicios/repetição/q2.html" class="btn-questao" title="Desenvolva a tabuada de um número usando for"><span>2.</span> Desenvolver tabuada com for</a>
            <a href="dist/exercicios/repetição/q3.html" class="btn-questao" title="Faça um programa que leia nome, horas trabalhadas, salário-hora e sexo de um grupo de operários. Ao final de cada solicitação pergunte se o usuário quer continuar ou não o programa. Calcule e imprima: Salário total dos funcionários, o maior salário, juntamente com o nome de quem o recebeu; O número de funcionários do sexo masculino e feminino cadastrado; O percentual de funcionários homens e mulheres cadastrados"><span>3.</span> Folha de pagamento de operários</a>
            <a href="dist/exercicios/repetição/q4.html" class="btn-questao" title="Faça um programa que leia um conjunto de números (X) e imprima a quantidade de números pares (QPares) e a quantidade de números ímpares (QImpares) lidos. Admita que o valor -1 é utilizado como sentinela para fim de leitura"><span>4.</span> Contar pares e ímpares até -1</a>
            <a href="dist/exercicios/repetição/q5.html" class="btn-questao" title="Analisador de Desempenho de Vendas (Relatório de Equipe). Imagine que você está gerindo uma equipe de 5 vendedores. Função classificarVenda(valor): Se valor &lt; 1000: Retorna &quot;Bronze&quot;, Se valor entre 1000 e 5000: Retorna &quot;Prata&quot;, Se valor &gt; 5000: Retorna &quot;Ouro&quot;. O Programa: Use um laço for para pedir o valor da venda de cada um dos 5 vendedores. Dentro do laço, chame a função de classificação. Ao final, o programa deve exibir: O total de vendas da equipe (soma), Quem foi o vendedor com a maior venda (maior valor digitado), Quantos vendedores atingiram a categoria &quot;Ouro&quot;"><span>5.</span> Análise de desempenho de vendas</a>
        </div>

        <a href="./index.html" class="voltar">&larr; voltar</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => document.querySelectorAll('.page-card').forEach(card => card.classList.add('enter')));
            document.querySelectorAll('.btn-questao').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const card = this.closest('.page-card');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
            document.querySelectorAll('.voltar').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const card = this.closest('.page-card');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
        });
    </script>

</body>
</html>
