

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src\img\icone2.png" type="image/png">
    <title>Meus Exercícios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>📚 Painel de Exercícios</h1>
    
    <h1 class="titulo-principal">TypeScript</h1>

    <div class="container page-card">
        <ul class="exercise-list">
          
            <li class="exercise-item">
                <a href="questao.html" class="exercise-link">
                    <span>-></span> Visualizador de Questões
                </a>
            </li>
        </ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.page-card').forEach(card => card.classList.add('enter'));
            document.querySelectorAll('.exercise-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const item = this.parentElement;
                    const card = this.closest('.page-card');
                    item.classList.add('expanding');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
        });
    </script>

    <img src="src/img/gif.gif" alt="Decoração" class="floating-gif">

</body>
</html>
