

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src\img\icone2.png" type="image/png">
    <title>Meus Exercícios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>📚 Painel de Exercícios</h1>
    <a href="src/img/download.png" target="_blank"><img src="src/img/download.png" height="90" width="500"></a>

    <div class="container page-card">
        <ul class="exercise-list">
            <li class="exercise-item">
                <a href="menu-condicional.html" class="exercise-link">
                    <span>01.</span> condicional
                </a>
            </li>
            <li class="exercise-item">
                <a href="menu-funcao.html" class="exercise-link">
                    <span>02.</span> função
                </a>
            </li>
            <li class="exercise-item">
                <a href="menu-repeticao.html" class="exercise-link">
                    <span>03.</span> repetição
                </a>
            </li>
            <li class="exercise-item">
                <a href="menu-arrays.html" class="exercise-link">
                    <span>04.</span> arrays
                </a>
            </li>
        </ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.page-card').forEach(card => card.classList.add('enter'));
            document.querySelectorAll('.exercise-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const item = this.parentElement;
                    const card = this.closest('.page-card');
                    item.classList.add('expanding');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
        });
    </script>

</body>
</html>
