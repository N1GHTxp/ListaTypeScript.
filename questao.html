      "codigo": "function calcularFolhaPagamento(valorHora: number, horasTrabalhadas: number): void {\n    const salarioBruto = valorHora * horasTrabalhadas;\n    let descontoIR = 0;\n    \n    if (salarioBruto <= 2428.80) {\n        descontoIR = 0;\n    } else if (salarioBruto <= 2826.65) {\n        descontoIR = salarioBruto * 0.075;\n    } else if (salarioBruto <= 3751.05) {\n        descontoIR = salarioBruto * 0.15;\n    } else if (salarioBruto <= 4664.68) {\n        descontoIR = salarioBruto * 0.225;\n    } else {\n        descontoIR = salarioBruto * 0.275;\n    }\n\n    const descontoSindicato = salarioBruto * 0.03;\n    const descontoValeTransporte = salarioBruto * 0.06;\n    const descontoValeAlimentacao = salarioBruto * 0.08;\n    const descontoINSS = salarioBruto * 0.10;\n    const fgts = salarioBruto * 0.11;\n    const totalDescontos = descontoIR + descontoSindicato + descontoValeTransporte + descontoValeAlimentacao + descontoINSS;\n    const salarioLiquido = salarioBruto - totalDescontos;\n\n    console.log(`Salário Bruto: (${valorHora} * ${horasTrabalhadas}) : R$ ${salarioBruto.toFixed(2)}`);\n    console.log(`(-) IR (${(descontoIR / salarioBruto * 100).toFixed(2)}%) : R$ ${descontoIR.toFixed(2)}`);\n    console.log(`(-) INSS (10%) : R$ ${descontoINSS.toFixed(2)}`);\n    console.log(`(-) SINDICATO (3%) : R$ ${descontoSindicato.toFixed(2)}`);\n    console.log(`(-) V. ALIMENTAÇÃO (8%) : R$ ${descontoValeAlimentacao.toFixed(2)}`);\n    console.log(`(-) V. TRANSPORTE (6%) : R$ ${descontoValeTransporte.toFixed(2)}`);\n    console.log(`FGTS (11%) : R$ ${fgts.toFixed(2)}`);\n    console.log(`Total de descontos : R$ ${totalDescontos.toFixed(2)}`);\n    console.log(`Salário Líquido : R$ ${salarioLiquido.toFixed(2)}`);\n}\n\nlet valorHora = parseFloat(prompt(\"Digite o valor da sua hora:\"));\nlet horasTrabalhadas = parseFloat(prompt(\"Digite a quantidade de horas trabalhadas no mês:\"));\n\nif (valorHora > 0 && horasTrabalhadas > 0) {\n    calcularFolhaPagamento(valorHora, horasTrabalhadas);\n}\nelse {\n    console.log(\"Por favor, digite valores positivos para o valor da hora e as horas trabalhadas.\");"

const select = document.getElementById('questionSelect');
const enunciado = document.getElementById('enunciado');
const resultadoDiv = document.getElementById('resultado');
const codigoPre = document.getElementById('codigo-js');

// Populate select
for (const category in data) {
    for (const questao in data[category]) {
        const option = document.createElement('option');
        option.value = `${category}-${questao}`;
        option.textContent = `${category.charAt(0).toUpperCase() + category.slice(1)} - Questão ${questao.replace('questao', '')}`;
        select.appendChild(option);
    }
}

select.addEventListener('change', () => {
    if (!select.value) {
        enunciado.innerHTML = 'Selecione uma questão para ver o enunciado.';
        codigoPre.textContent = 'Selecione uma questão para ver o código.';
        return;
    }
    const [category, questao] = select.value.split('-');
    enunciado.innerHTML = data[category][questao].enunciado.replace(/\n/g, '<br>');
    codigoPre.textContent = 'Clique em Executar Código para carregar o script desta questão.';
    resultadoDiv.innerText = '';
});

function getJSPath(category, questao) {
    const fileName = category === 'condicional' && questao === 'questao1' ? 'Cquestao1.js' : `${questao}.js`;
    return `dist/exercicios/${category}/${fileName}`;
}

// Override console.log
console.log = function(...args) {
    const linha = args.map(arg => {
        if (Array.isArray(arg)) return "[" + arg.join(", ") + "]";
        if (typeof arg === 'object') return JSON.stringify(arg);
        return arg;
    }).join(" ");
    
    resultadoDiv.innerText += linha + "\n";
};

document.write = function(...args) {
    resultadoDiv.innerText += args.join('');
};

async function executarQuestao() {
    if (!select.value) {
        resultadoDiv.innerText = 'Selecione uma questão antes de executar.';
        return;
    }
    resultadoDiv.innerText = '';
    const antigo = document.getElementById('executor');
    if (antigo) antigo.remove();

    const [category, questao] = select.value.split('-');
    const jsPath = getJSPath(category, questao);

    try {
        const response = await fetch(encodeURI(jsPath));
        if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
        const code = await response.text();
        codigoPre.textContent = code;

        const script = document.createElement('script');
        script.id = 'executor';
        script.textContent = '(function(){\n' + code + '\n})();';
        document.body.appendChild(script);
    } catch (error) {
        resultadoDiv.innerText = 'Erro ao carregar ou executar o arquivo: ' + error;
    }
}
</script>
