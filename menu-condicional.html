<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de Repetição</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="menu-body">

    <div class="page-card">
        <h1>Questões de Repetição</h1>
        
        <div class="menu-questoes">
            <a href="dist/exercicios/condicional/q1.html" class="btn-questao" title="Crie um programa que leia um número e informe se ele é: Par ou Ímpar, Positivo ou Negativo"><span>1.</span> Verificar se número é par/ímpar e positivo/negativo</a>
            <a href="dist/exercicios/condicional/q2.html" class="btn-questao" title="Crie um programa chamado Estações. Este programa deve ler uma data e armazenar na variável mês, um número entre 1 e 12, correspondendo a um dos meses do ano. No final, você deve imprimir uma mensagem conforme o exemplo: &quot;A estação do ano correspondente ao mês 3 é Verão&quot; Considere a estação prevalente para cada mês: Janeiro (1): Verão, Fevereiro (2): Verão, Março (3): Verão, Abril (4): Outono, Maio (5): Outono, Junho (6): Outono, Julho (7): Inverno, Agosto (8): Inverno, Setembro (9): Inverno, Outubro (10): Primavera, Novembro (11): Primavera, Dezembro (12): Primavera"><span>2.</span> Determinar estação do ano baseada no mês</a>
            <a href="dist/exercicios/condicional/q3.html" class="btn-questao" title="Crie um programa que solicite dois números e simule um menu de uma calculadora: 1 - Soma, 2 - Subtração, 3 - Multiplicação, 4 - Divisão. Use switch...Case"><span>3.</span> Calculadora com menu e switch</a>
            <a href="dist/exercicios/condicional/q4.html" class="btn-questao" title="Ler dois valores e imprimir uma das três mensagens a seguir: 'Números iguais', caso os números sejam iguais; 'Primeiro é maior', caso o primeiro seja maior que o segundo; 'Segundo maior', caso o segundo seja maior que o primeiro"><span>4.</span> Comparar dois números</a>
        </div>

        <a href="./index.html" class="voltar">&larr; voltar</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => document.querySelectorAll('.page-card').forEach(card => card.classList.add('enter')));
            document.querySelectorAll('.btn-questao').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const card = this.closest('.page-card');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
            document.querySelectorAll('.voltar').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const card = this.closest('.page-card');
                    this.classList.add('expanding');
                    if (card) card.classList.remove('enter');
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 450);
                });
            });
        });
    </script>

</body>
</html>
